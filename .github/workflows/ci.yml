name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / MSVC correctness and benchmark builds
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      RG_CORE_DIR: ${{ github.workspace }}\_deps\rg_core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: superwendel/rg_core
          ref: d5d3f4413da22568572a37f5c6bf4e0506c68a2a
          path: _deps/rg_core
          persist-credentials: false
      - name: Correctness, generated benchmarks, and GPU compile check
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64
          call build.bat test || exit /b 1
          call build.bat test_bench || exit /b 1
          python tools\prepare_bench.py --png --sdl || exit /b 1
          set "SDL3_DIR=%CD%\build\bench-deps\SDL3-3.4.14"
          call build.bat rgi_viewer || exit /b 1
          call build.bat rgi_thumbnail || exit /b 1
          call build.bat test_viewer || exit /b 1
          python benchmarks\run.py --filter odd-small --samples 1 --output build\ci-cpu || exit /b 1
          python benchmarks\run.py --legacy-encode --palette-experiment --verify-only --no-libpng --output build\ci-palette || exit /b 1
          python benchmarks\run.py --gpu direct3d12 --sdl-root build\bench-deps\SDL3-3.4.14 --build-only --output build\ci-gpu || exit /b 1

  linux:
    name: Linux / Clang sanitizers and C++ inclusion
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RG_CORE_DIR: ${{ github.workspace }}/_deps/rg_core
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: superwendel/rg_core
          ref: d5d3f4413da22568572a37f5c6bf4e0506c68a2a
          path: _deps/rg_core
          persist-credentials: false
      - name: Codec, allocator, converter, and benchmark checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci
          flags=(-std=c99 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I src -I "$RG_CORE_DIR/src")
          clang "${flags[@]}" tests/test_rgi.c -o build/ci/test_rgi
          build/ci/test_rgi
          clang "${flags[@]}" -DRG_RGI_NO_SIMD tests/test_rgi.c -o build/ci/test_scalar
          build/ci/test_scalar
          clang "${flags[@]}" tests/test_rgi_allocator.c -o build/ci/test_allocator
          build/ci/test_allocator
          clang "${flags[@]}" -DRG_RGI_NO_PALETTE_ENCODE tests/test_rgi.c -o build/ci/test_legacy
          build/ci/test_legacy
          clang "${flags[@]}" -DRG_RGI_NO_PALETTE_ENCODE tests/test_rgi_allocator.c -o build/ci/test_allocator_legacy
          build/ci/test_allocator_legacy
          clang++ -std=c++17 -Wall -Wextra -Werror -I src -I "$RG_CORE_DIR/src" tests/test_rgi_cpp.cpp -o build/ci/test_cpp
          build/ci/test_cpp
          clang "${flags[@]}" -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES tools/rgi_convert.c third_party/miniz/miniz_tinfl.c -lm -o build/ci/rgi_convert
          build/ci/rgi_convert tests/fixtures/legacy/baseline/odd-small.rgi build/ci/migrated.rgi
          cmp tests/fixtures/legacy/baseline/odd-small.rgi build/ci/migrated.rgi
          python3 -m unittest discover -s tests -p test_bench.py
          python3 tools/prepare_bench.py --png
          python3 benchmarks/run.py --filter odd-small --samples 1 --output build/ci-bench
          python3 benchmarks/run.py --legacy-encode --palette-experiment --verify-only --no-libpng --output build/ci-palette

# Device tests and the complete external corpus are explicit local runs.
# Hosted CI never treats timing changes as correctness failures.
